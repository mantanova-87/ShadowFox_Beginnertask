<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantavya_Portfolio</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body class="overflow-hidden">
    <div class="relative w-screen h-screen bg-gradient-to-br from-black via-slate-900 to-purple-900">
        <div class="pt-1">
            <nav
                class="flex justify-between items-center  rounded-4xl bg-gradient-to-br from-purple-900 via-slate-900 to-black backdrop-blur-md border-white/0.90 px-3 py-1 shadow-lg shadow-black/50 z-50">

                <div class="flex items-center justify-between w-full">
                    <img id="logo"
                    src="./assets/favicon2.png"
                    alt="LOGO"
                    class="w-12 h-12 rounded-full object-cover">
                    <h1 id="navTitle" class="justify-left items-center text-white font-bold text-0.5xl"></h1><br>
                    <button id="menuBtn" class="md:hidden text-white text-3xl">
                        ☰
                    </button>
                </div>
                <div id="navLinks" class="hidden md:flex items-center whitespace-nowrap   justify-between gap-8">
                    <button id="about" class="px-1 py-0.9 bg-blue-500 rounded-lg text-white">
                        About Me
                    </button>
                    <button id="edu" class="px-1 py-0.9 bg-blue-500 rounded-lg text-white">
                        Educatioal Details
                    </button>
                    <button id="con" class="px-1 py-0.9 bg-blue-500 rounded-lg text-white">
                        Contact Me
                    </button>
                    <button id="skl" class="px-1 py-0.9 bg-blue-500 rounded-lg text-white">
                        Skills and Projects
                    </button>
                    <button id="ach" class="px-1 py-0.9 bg-blue-500 rounded-lg text-white">
                        Achievements
                    </button>
                </div>
            </nav>
        </div>
        <section class="flex flex-col-reverse md:flex-row items-center justify-between px-8 py-12 gap-10">
            <!-- Left Side -->
            <div class="md:w-1/2 text-white">

                <h1 class="text-5xl font-bold mb-4">
                    Hi, I'm Mantavya Kumar
                </h1>

                <p class="text-lg mb-4">
                    Cybersecurity enthusiast passionate about securing digital systems.
                </p>

                <p class="text-lg mb-4">
                    Skilled in programming, networking, and security research.
                </p>

                <p class="text-lg">
                    Exploring cybersecurity, web development, and modern technologies.
                </p>

            </div>

            <div class="md:w-1/2 flex justify-center items-center">
                <div
                    class="p-2 rounded-full bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 shadow-xl shadow-cyan-500/30">

                    <img id="heroPfp" src="./assets/profile.jpg" alt="Profile"
                        class="w-64 h-64 rounded-full object-cover">

                </div>

            </div>

        </section>

    </div>
    <script src="script.js"></script>
</body>

</html>
